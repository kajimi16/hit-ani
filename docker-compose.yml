# hit-ani 生产部署
#
# 三个服务：postgres / web（页面+API） / gateway（弹幕 WebSocket）。
#
# 为什么网关是独立服务而不是复用 web 容器：
# WebSocket 是长连接常驻进程，与 Next.js 的请求-响应模型不同 ——
# 合在一起会导致重启 web 时所有弹幕连接断开，也无法独立重启。
#
# 用法：
#   cp .env.example .env      # 填 POSTGRES_PASSWORD / SESSION_SECRET 等
#   npm run docker:up
#   npm run docker:logs

name: hit-ani

services:
  # ---------------------------------------------------------------- 数据库
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hitani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hitani}
    volumes:
      # 命名卷：容器重建不丢数据。备份方式见 docs/DEPLOY.md
      - pgdata:/var/lib/postgresql/data
    # 只绑到**回环地址**，不暴露到局域网。
    #
    # 为什么需要一个端口：冒烟测试通过 HTTP 写入目标实例，但**清理要直连数据库**。
    # 没有这个端口时，清理会连到宿主机 .env 里的开发库，而测试数据留在容器库里 ——
    # 实测踩过：清理「成功」了，但容器里仍残留测试弹幕。
    #
    # 绑 127.0.0.1 保证只有本机能连（局域网与其他机器都不可达），
    # 端口取 55433 避开宿主机上可能已有的 5432/55432。
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55433}:5432"
    healthcheck:
      # 用 healthcheck 而非仅 depends_on —— 否则依赖服务会在数据库
      # 尚未接受连接时就启动，表现为启动即失败
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hitani} -d ${POSTGRES_DB:-hitani}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------- 建表
  #
  # 一次性任务：同步 schema 后退出。web 与 gateway 都等它成功退出。
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      # 用 migrator 阶段：它保留 devDependencies，因而有 prisma CLI。
      # 生产镜像（runner）出于体积考虑剔除了 CLI。
      target: migrator
    restart: "no"
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    environment: &db-url
      DATABASE_URL: postgresql://${POSTGRES_USER:-hitani}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hitani}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------- Web
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # 对外只暴露这一个端口 —— 页面与 API 同进程
    ports:
      - "${WEB_PORT:-3100}:3100"
    env_file:
      # 业务配置（BGM / QQ / dandanplay / 屏蔽词 / 管理员 …）从 .env 读。
      # `required: false` 让缺失时不报错，便于最小化启动。
      - path: .env
        required: false
    environment:
      <<: *db-url
      NODE_ENV: production
      # 浏览器侧连接弹幕网关用的端口。主机名**自动按页面地址推导**，
      # 因此这里只需给端口 —— 写死完整 URL（含 localhost）会让其他机器
      # 上的浏览器去连自己的机器，与 Jellyfin 填 localhost 是同一类坑。
      NEXT_PUBLIC_DANMAKU_WS_PORT: ${DANMAKU_GATEWAY_PORT:-3102}
      # 仅反向代理等特殊场景需要显式覆盖；留空即走自动推导
      NEXT_PUBLIC_DANMAKU_WS_URL: ${NEXT_PUBLIC_DANMAKU_WS_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------- 弹幕网关
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # 跑打包产物而非 tsx —— 生产镜像已剔除 devDependencies
    command: ["node", "dist/danmaku-gateway.mjs"]
    ports:
      - "${DANMAKU_GATEWAY_PORT:-3102}:3102"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *db-url
      NODE_ENV: production
      DANMAKU_GATEWAY_PORT: "3102"
      # 必须与 web 用同一个 SESSION_SECRET —— 网关靠它校验连接建立时的会话，
      # 两者不一致会导致学生登录了却连不上弹幕
      SESSION_SECRET: ${SESSION_SECRET:?必须在 .env 里设置 SESSION_SECRET}
      # 网关同样要做屏蔽词校验：REST 与 WS 是两条独立的写入通道
      DANMAKU_BLOCKED_WORDS: ${DANMAKU_BLOCKED_WORDS:-}
    healthcheck:
      # **必须覆盖**镜像级检查：镜像里那个打的是 3100（web 的端口），
      # 而网关只监听 3102 —— 不覆盖会导致容器永久显示 unhealthy，
      # 掩盖真实的健康状态。这里直接打网关自己的 HTTP 状态端点。
      test: ["CMD", "curl", "-fsS", "http://localhost:3102/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- Jellyfin
  #
  # 本地媒体库。学生通过 hit-ani 的「在这里看」面板播放 ——
  # **视频字节由浏览器直连这里，不经过 hit-ani 的 web/gateway**，
  # 因此不消耗对外带宽（校园网内走 LAN）。
  #
  # ⚠️ 角色变化：这使平台从「索引方」变成「媒体服务器运营方」。
  # 收录什么内容由部署方决定并承担相应责任，见 docs/MEDIA.md §6.4。
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      # 学生浏览器直连这个端口取流 —— 必须对外可达
      - "${JELLYFIN_PORT:-3103}:8096"
    volumes:
      # 媒体库：**只读**挂载。Jellyfin 不需要写媒体文件，
      # 只读能把它被攻破时的损害限制在「读到媒体」。
      - ${MEDIA_LIBRARY_PATH:-/media/kajimi/kajimi/hit-ani/media}:/media:ro
      # 配置与缓存放**内部盘**（命名卷）：外挂硬盘是 USB 可拔插的，
      # 掉线不能让 Jellyfin 的元数据一起丢。
      - jellyfin-config:/config
      - jellyfin-cache:/cache
    environment:
      # Jellyfin 生成给客户端的 URL —— 不设的话它会用容器内部的地址，
      # 学生那边会连不上。
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLIC_URL:-http://localhost:3103}
    healthcheck:
      # 两道检查，因为故障表现完全不同：
      # 1. 服务本身活着
      # 2. **媒体库哨兵文件在** —— 外挂硬盘未挂载时，挂载点是个空目录，
      #    Jellyfin 会看到空库且不报错。哨兵缺失即说明盘没挂上。
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:8096/System/Info/Public >/dev/null
          && test -f /media/.library-root
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
    driver: local
  jellyfin-config:
    driver: local
  jellyfin-cache:
    driver: local
