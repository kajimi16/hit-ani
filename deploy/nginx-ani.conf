# hit-ani —— ani.kajimi.cc 的反向代理
#
# 安装到 /etc/nginx/conf.d/ani.conf（见仓库 README 或 docs/DEPLOY.md §1.7）。
#
# ## 为什么让 nginx 转发到 3100，而不是直接让同学访问 :3100
#
# 域名不带端口，浏览器只会打 80/443。而站点在 3100、弹幕网关在 3102。
# 所以必须有一个入口把这两个都收进来。
#
# ## 弹幕为什么要走**同源路径** `/danmaku-ws`
#
# 网关是独立服务、独立端口。若不做这一步，浏览器会按页面地址推导出
# `ws://ani.kajimi.cc:3102` —— 那要求 3102 对同学可达，而且升级到 HTTPS 后
# 还得为它单独签一张证书（`wss://` 才能用，否则被浏览器拦）。
#
# 走同源路径则协议与端口都跟随页面：现在 `ws://`，将来上 HTTPS 自动变 `wss://`，
# 证书只用管一张，3102 也不必对外开放。
#
# ⚠️ 代价：`NEXT_PUBLIC_DANMAKU_WS_URL=/danmaku-ws` 是**构建期**烘焙的，
#    改它必须重新构建镜像，只改 .env 不生效：
#        docker compose build migrate web gateway && docker compose up -d
#
# ⚠️ 网关只匹配 `/danmaku/room/<id>`（见 src/server/danmaku-gateway.ts 的正则），
#    所以下面 `proxy_pass` 的**尾斜杠是关键** —— 它负责把 `/danmaku-ws` 前缀剥掉。
#    去掉尾斜杠会变成 404，而错误信息与「弹幕连不上」毫无关系。

server {
    listen 80;
    listen [::]:80;
    server_name ani.kajimi.cc;

    # 客户端上传体积。本项目没有上传大文件的功能，但默认 1m 对长文本正文
    # （影评）偏紧，给到 4m 留余量。
    client_max_body_size 4m;

    # Let's Encrypt 的 HTTP-01 挑战目录。
    # 用 `certbot --webroot -w /var/www/certbot` 时走这里。
    # 若用 `certbot --nginx`，它会自己插一条等价规则，留着也不冲突。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------------------------------------------------------- 弹幕 WebSocket
    location /danmaku-ws/ {
        # 尾斜杠 = 剥掉前缀。**不要删**（见文件头的说明）。
        proxy_pass http://127.0.0.1:3102/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket 是长连接，不能按默认的 60s 断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------------------------------------------------------------- 站点
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ⚠️ 两条硬要求之一：**覆盖**入站的 X-Forwarded-*，不要透传。
        #
        # 客户端可以自带这两个头。直接透传的话，任何能到达本端口的人都能伪造
        # 它们，从而影响服务端对「对外地址」的判断（开放重定向）。
        # 设 `proxy_set_header` 本身就是「覆盖」——它不会把客户端的同名头带过去。
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 端口与真实 IP 的链。服务端读它需要 TRUST_PROXY_HEADERS=1；
        # 本项目改用 APP_BASE_URL，因此这里是「备而不用」。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 上游（BGM / 抓取源）偶尔很慢，而条目页首次访问会同步拉取。
        # 默认 60s 会让「首次打开一个冷门条目」偶发 504。
        proxy_read_timeout 120s;
    }
}
