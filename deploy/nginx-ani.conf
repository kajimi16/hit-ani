# hit-ani —— ani.kajimi.cc 的反向代理（HTTP + HTTPS）
#
# 安装到 /etc/nginx/conf.d/ani.conf：
#     sudo cp deploy/nginx-ani.conf /etc/nginx/conf.d/ani.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# ## 证书怎么来的
#
# 用 **DNS-01**（不是 HTTP-01）：
#
#     sudo python3.10 /usr/local/bin/certbot certonly \
#       -a dns-godaddy --dns-godaddy-credentials /etc/letsencrypt/godaddy.ini \
#       -d ani.kajimi.cc --non-interactive --agree-tos
#
# **为什么必须用 DNS-01**：`ani.kajimi.cc` 解析到私网地址（10.249.61.10），
# Let's Encrypt 的验证服务器在公网上**根本路由不到**它 —— HTTP-01 必然失败。
# DNS-01 只在 DNS 里放一条 TXT 记录，不需要任何入站可达性。
#
# ⚠️ 宿主的 certbot 是坏的：`/usr/local/bin/certbot` 的 shebang 指向
# `python3`（现为 3.12），而 certbot 装在 **python3.10** 的 dist-packages 里
# → `ModuleNotFoundError`。所以上面显式用 `python3.10` 解释那个 wrapper。
# 这也正是 gal.kajimi.cc 的证书在 2026-09-01 过期没人续的原因。
#
# ⚠️ certbot 需要出网（LE API + GoDaddy API），而本机没有直连外网的路由，
# 所以必须把代理显式传给 root（`sudo` 默认重置环境变量）：
#     sudo env HTTPS_PROXY=http://127.0.0.1:7897 HTTP_PROXY=http://127.0.0.1:7897 ...
#
# ## 弹幕为什么走**同源路径** `/danmaku-ws`
#
# 网关是独立服务、独立端口（3102）。若不做这一步，浏览器会按页面地址推导出
# `wss://ani.kajimi.cc:3102` —— 那要求 3102 对同学可达，且单独签一张证书。
# 走同源路径则协议与端口都跟随页面：HTTPS 下自动是 `wss://`，证书只用管一张。
#
# ⚠️ `NEXT_PUBLIC_DANMAKU_WS_URL=/danmaku-ws` 是**构建期**烘焙的，
#    改它必须重新构建镜像，只改 .env 不生效。
#
# ⚠️ 网关只匹配 `/danmaku/room/<id>`，所以下面 `proxy_pass` 的**尾斜杠是关键**
#    —— 它负责剥掉 `/danmaku-ws` 前缀。实测：有尾斜杠 101 握手成功，去掉即 404。

# ---------------------------------------------------------------- HTTP（80）
#
# 只做两件事：放行 ACME 挑战，其余全部跳到 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name ani.kajimi.cc;

    # 万一将来换成 HTTP-01 / webroot 续期，这条能让它工作。
    # 当前用 DNS-01，所以这里平时是空转的。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- HTTPS（443）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx ≥ 1.25.1 的写法；旧版要写成 `listen 443 ssl http2;`
    http2 on;

    server_name ani.kajimi.cc;

    ssl_certificate     /etc/letsencrypt/live/ani.kajimi.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ani.kajimi.cc/privkey.pem;

    # 只留 TLS 1.2/1.3。1.0/1.1 早已被主流浏览器弃用，且会上不了 A 级评分。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ani_tls:2m;
    ssl_session_timeout 1h;

    # 刻意**不开 HSTS**：HSTS 会把「必须用 HTTPS」写进浏览器，一旦将来
    # 需要临时退回 HTTP（比如证书续期失败），在生效期内无法回退。
    # 证书稳定运行一段时间后想开，再加
    #     add_header Strict-Transport-Security "max-age=31536000" always;

    # 影评这类长文本正文，默认 1m 偏紧
    client_max_body_size 4m;

    # ---------------------------------------------------------- 弹幕 WebSocket
    location /danmaku-ws/ {
        # 尾斜杠 = 剥掉前缀。**不要删**（见文件头的说明）。
        proxy_pass http://127.0.0.1:3102/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket 是长连接，不能按默认的 60s 断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------------------------------------------------------------- 站点
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ⚠️ 两条硬要求之一：**覆盖**入站的 X-Forwarded-*，不要透传。
        # 客户端可以自带这两个头；直接透传的话，任何能到达本端口的人都能伪造
        # 它们，从而影响服务端对「对外地址」的判断（开放重定向）。
        # 用 `proxy_set_header` 本身就是覆盖 —— 它不会把客户端的同名头带过去。
        proxy_set_header X-Forwarded-Host  $host;

        # ⚠️ 这一条**直接决定会话 Cookie 带不带 `Secure`**：
        # 服务端读 `x-forwarded-proto`，只有 `https` 才加 `Secure`
        # （见 src/lib/auth/cookie-policy.ts —— 它刻意不用 NODE_ENV 推断，
        #   因为那会让局域网 HTTP 访问下 Cookie 被浏览器静默丢弃）。
        # 写错这里 = HTTPS 下少了 Secure，或 HTTP 下登录不上。
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 上游（BGM / 抓取源）偶尔很慢，而条目页首次访问会同步拉取。
        # 默认 60s 会让「首次打开一个冷门条目」偶发 504。
        proxy_read_timeout 120s;
    }
}
